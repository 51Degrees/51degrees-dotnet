name: Pull Requests

# Builds and tests every open pull request into main with the shared
# workflow, and merges each one that passes and is approved.

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      full-matrix:
        description: 'Build every configuration, not only those the changes need'
        type: boolean
        default: false

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      cache-assets: true
      # Each pull request is built on the configurations its changes need,
      # as ci/select-options.ps1 chooses, and one that fails does not cancel
      # the others. With nothing eligible, the nightly builds rc instead.
      full-matrix: ${{ inputs.full-matrix || false }}
      fail-fast: false
      build-without-pull-requests: false
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      StrongNameKeyBase64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
      AcceptCHBrowserKey: ${{ secrets.ACCEPTCH_BROWSER_KEY }}
      AcceptCHHardwareKey: ${{ secrets.ACCEPTCH_HARDWARE_KEY }}
      AcceptCHPlatformKey: ${{ secrets.ACCEPTCH_PLATFORM_KEY }}
      AcceptCHNoneKey: ${{ secrets.ACCEPTCH_NONE_KEY }}
