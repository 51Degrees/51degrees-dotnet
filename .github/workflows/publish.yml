name: Publish

# Builds, tests and packs every NuGet package that changed since its last
# '<package>/<version>' tag, and every package depending on one of them, then
# pushes to NuGet and tags each package. A dry run does everything except
# push, tag and open the versions pull request.

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      # common-ci refuses a release less than a week after the last unless
      # this is set, which is only for a release agreed to go out early.
      allow-early-release:
        description: 'Publish even though a package was released less than a week ago'
        type: boolean
        default: false

jobs:
  Publish:
    name: Publish
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      allow-early-release: ${{ inputs.allow-early-release || false }}
      build-platform: windows-latest
      cache-assets: true
      package-in-caller: true
    secrets: inherit

  # nuget.org's trusted publishing issues a key only to a job in this
  # repository's own workflow file, so the packages are pushed here, with the
  # steps of common-ci's Package job. The key lasts an hour, so it is asked for
  # just before the push.
  Package:
    needs: Publish
    if: needs.Publish.outputs.update-required == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Common
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.repository.owner.login }}/common-ci

      - name: Download Package Artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ github.workspace }}/package

      # The user who created the trusted publishing policy on nuget.org.
      - name: Get a NuGet key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: jwrosewell

      # The scripts read the automation token and the NuGet key from the
      # environment, under the names common-ci's own Package job uses.
      - name: Package
        env:
          _51DEGREES_ACCESS_TOKEN: ${{ secrets._51DEGREES_ACCESS_TOKEN }}
          _51DEGREES_PUBLISH_NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          $DryRun = [bool]::Parse( "${{ inputs.dryrun || false }}" )
          $Options = @{}
          $Options.Add("Version", "${{ needs.Publish.outputs.version }}")
          ./nightly-publish.package.ps1 `
          -RepoName ${{ github.event.repository.name }} `
          -OrgName ${{ github.event.repository.owner.login }} `
          -Branch ${{ github.ref_name }} `
          -Options $Options `
          -GitHubUser Automation51D `
          -GitHubEmail 51DCI@51Degrees.com `
          -DryRun $DryRun
