name: Temporary red run for the tilde path tests

on:
  push:
    branches:
      - 'tmp/tilde-red'

jobs:
  Build:
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-request.yml@main
    with:
      repo-name: 51degrees-dotnet
      org-name: 51Degrees
      pull-request-id: 0
      dryrun: 'true'
      branch: tmp/tilde-red
      skip-compare-performance: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      StrongNameKeyBase64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
