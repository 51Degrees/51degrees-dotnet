name: CI speed probe

# Temporary, on the ci-speed branch only. Runs the build and test steps of the
# pull request job on every platform in ci/options.json, against this branch,
# so the test time changes can be checked before they reach main. Remove
# before merging.

on:
  push:
    branches: [ci-speed]

defaults:
  run:
    shell: pwsh

jobs:
  Options:
    runs-on: ubuntu-latest
    outputs:
      options: ${{ steps.read.outputs.options }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ci/options.json
      - id: read
        run: |
          $options = Get-Content ci/options.json -Raw | ConvertFrom-Json | ConvertTo-Json -Compress -AsArray
          "options=$options" >> $env:GITHUB_OUTPUT

  Test:
    needs: Options
    name: ${{ matrix.options.Name }}
    runs-on: ${{ matrix.options.Image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        options: ${{ fromJSON(needs.Options.outputs.options) }}
    steps:
      - name: Checkout common-ci
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/common-ci

      - name: Clone this repository at ${{ github.ref_name }}
        run: |
          ./steps/configure-git.ps1 -GitHubToken '${{ secrets.ACCESS_TOKEN }}' -GitHubUser Automation51D -GitHubEmail 51DCI@51degrees.com
          ./steps/clone-repo.ps1 -RepoName '${{ github.event.repository.name }}' -OrgName '${{ github.repository_owner }}' -Branch '${{ github.ref_name }}'

      # The secrets are named one by one. A workflow that hands every secret
      # to a step with toJSON(secrets) is held for manual approval.
      - name: Build and test
        env:
          KEY_TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          KEY_StrongNameKeyBase64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
          KEY_DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
          KEY_DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
          KEY_IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
          KEY_AcceptCHBrowserKey: ${{ secrets.ACCEPTCH_BROWSER_KEY }}
          KEY_AcceptCHHardwareKey: ${{ secrets.ACCEPTCH_HARDWARE_KEY }}
          KEY_AcceptCHPlatformKey: ${{ secrets.ACCEPTCH_PLATFORM_KEY }}
          KEY_AcceptCHNoneKey: ${{ secrets.ACCEPTCH_NONE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = @{}
          foreach ($entry in Get-ChildItem env:KEY_*) {
            if ($entry.Value) { $keys[$entry.Name.Substring(4)] = $entry.Value }
          }
          $options = @{
            RepoName = '${{ github.event.repository.name }}'
            OrgName = '${{ github.repository_owner }}'
            Name = '${{ matrix.options.Name }}'
            Arch = '${{ matrix.options.Arch }}'
            Configuration = '${{ matrix.options.Configuration }}'
            BuildMethod = '${{ matrix.options.BuildMethod }}'
            Keys = $keys
            DryRun = $true
          }
          $options += $keys
          foreach ($step in 'fetch-assets', 'setup-environment', 'build-project', 'run-unit-tests', 'run-integration-tests') {
            Write-Host "::group::$step"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            ./steps/run-script.ps1 "./$($options.RepoName)/ci/$step.ps1" $options
            Write-Host "::endgroup::"
            Write-Host ("STEPTIME {0} {1:n1}m" -f $step, $sw.Elapsed.TotalMinutes)
          }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.options.Name }}
          path: ${{ github.event.repository.name }}/test-results
          if-no-files-found: ignore
