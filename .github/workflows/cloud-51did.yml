name: Cloud 51Did Tests

# Runs the live cloud 51Did tests with every key under the name of its own
# secret. Each test reads the key it needs by that name and skips, naming it,
# when the key is empty. The step fails when no resource key reached it at
# all, because a cloud test that passes without calling the cloud has proved
# nothing.
#
# Two projects run. Tests/FiftyOne.Did.Tests, CloudFodIdTests, obtains a real
# 51Did and parses it, once with _51DEGREES_RESOURCE_KEY_51DID and once with
# _51DEGREES_RESOURCE_KEY_BESPOKE, and CloudDidClientTests verifies it and
# redeems a sealed result with _51DEGREES_LICENSE_KEY_51DID, which reads only
# a result sealed with _51DEGREES_RESOURCE_KEY_51DID.
# Tests/FiftyOne.Did.Cloud.Tests, DidCloudEngineLiveEntitlementTests, builds a
# customer style pipeline against the live cloud with each of
# _51DEGREES_RESOURCE_KEY_BASIC, _51DEGREES_RESOURCE_KEY_BESPOKE and
# _51DEGREES_RESOURCE_KEY_51DID, and checks that the outcome matches what the
# key is entitled to.
#
# The secrets are named one by one rather than passed as toJSON(secrets),
# because GitHub holds a run that hands every secret to a step for manual
# approval. _51DEGREES_CLOUD_ENDPOINT is the organisation variable, and the
# tests use the public cloud when it is empty.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. The six 51Did packages are staggered
  # ten minutes apart so they do not all ask the cloud at once, and this one
  # runs at 05:00 UTC.
  schedule:
    - cron: '0 5 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'pipeline/Did/**'
      - 'pipeline/Did.Cloud/**'
      - 'pipeline/Did.Core/**'
      - 'pipeline/Tests/Did.Tests/**'
      - 'pipeline/Tests/Did.Cloud.Tests/**'
      - 'pipeline/owid-dotnet/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FiftyOne.Did compiles the owid-dotnet submodule source directly.
          submodules: recursive
      # The test projects target net8.0 and net10.0, and dotnet test runs
      # both, so both runtimes are needed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Cloud 51Did tests
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_51DID: ${{ secrets._51DEGREES_RESOURCE_KEY_51DID }}
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
          _51DEGREES_CLOUD_ENDPOINT: ${{ vars._51DEGREES_CLOUD_ENDPOINT }}
        run: |
          $resourceKeys = '_51DEGREES_RESOURCE_KEY_BASIC',
            '_51DEGREES_RESOURCE_KEY_BESPOKE', '_51DEGREES_RESOURCE_KEY_51DID'
          if (-not ($resourceKeys | Where-Object {
              [Environment]::GetEnvironmentVariable($_) })) {
            Write-Host "::error::None of $($resourceKeys -join ', ') reached this job, so no test would call the cloud."
            exit 1
          }
          # The redeem test reads only a result sealed with the 51Did resource
          # key, so without that key the license key would go untested.
          if ($env:_51DEGREES_LICENSE_KEY_51DID -and
              -not $env:_51DEGREES_RESOURCE_KEY_51DID) {
            Write-Host '::error::_51DEGREES_LICENSE_KEY_51DID has a value but _51DEGREES_RESOURCE_KEY_51DID is empty, so the redeem test would not run. Add the secret _51DEGREES_RESOURCE_KEY_51DID.'
            exit 1
          }
          $runs = @(
            @{ Project = 'pipeline/Tests/Did.Tests/FiftyOne.Did.Tests.csproj'
               Filter  = 'FullyQualifiedName~CloudFodIdTests|FullyQualifiedName~CloudDidClientTests' },
            @{ Project = 'pipeline/Tests/Did.Cloud.Tests/FiftyOne.Did.Cloud.Tests.csproj'
               Filter  = 'FullyQualifiedName~DidCloudEngineLiveEntitlementTests' }
          )
          $failed = $false
          foreach ($run in $runs) {
            dotnet build $run.Project -c Release --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "::group::$(Split-Path $run.Project -Leaf)"
            dotnet test $run.Project -c Release --no-build --nologo `
              --filter $run.Filter `
              --logger 'console;verbosity=normal'
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
