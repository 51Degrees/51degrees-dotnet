name: Temporary 51Did tests check

# Throwaway workflow for tmp/issues-dotnet-did-* branches. Deleted with
# the branch.
on:
  push:
    branches:
      - 'tmp/issues-dotnet-did-*'

jobs:
  DidTests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 51Did tests
        shell: pwsh
        run: >
          dotnet test pipeline/Tests/Did.Tests/FiftyOne.Did.Tests.csproj --filter "FullyQualifiedName~FodId&FullyQualifiedName!~CloudFodIdTests|FullyQualifiedName~DidClientTests"
          -c Release -p:FiftyOneReferences=Project
          --logger "console;verbosity=normal"
