name: Dispose test repeat

on:
  push:
    branches:
      - 'tmp/dispose-**'

jobs:
  mac_x64:
    name: Mac_x64_Release repeat
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Machine
        run: |
          echo "logical cores: $(sysctl -n hw.ncpu)"
          echo "physical cores: $(sysctl -n hw.physicalcpu)"
          echo "memory bytes: $(sysctl -n hw.memsize)"

      - name: Build
        run: |
          dotnet build \
            pipeline/Tests/Engines.FiftyOne.Tests/FiftyOne.Pipeline.Engines.FiftyOne.Tests.csproj \
            -c Release -p:FiftyOneReferences=Project

      - name: Run the assembly ten times
        run: |
          failed=0
          for i in $(seq 1 10); do
            echo "===== iteration $i ====="
            if dotnet test \
              pipeline/Tests/Engines.FiftyOne.Tests/FiftyOne.Pipeline.Engines.FiftyOne.Tests.csproj \
              -c Release --no-build -l "console;verbosity=detailed" > run-$i.log 2>&1; then
              echo "iteration $i: the assembly PASSED"
            else
              echo "iteration $i: the assembly FAILED"
              failed=$((failed+1))
            fi
            grep -E "DISPOSEDIAG|(Passed|Failed) ShareUsageElement_Dispose_SendsEveryRemainingEntry|^(Passed|Failed)!" run-$i.log || true
            grep -E "^\s+Failed [A-Za-z]" run-$i.log | sort | uniq -c || true
          done
          echo "===== $failed of 10 iterations had a failing test ====="
