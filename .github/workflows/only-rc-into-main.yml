name: Only rc into main

# A pull request into the default branch must come from rc, and as this
# repository publishes packages, a release must come at least a week after
# the last one. See 51Degrees/common-ci .github/workflows/only-rc-into-main.yml.
on:
  pull_request:

jobs:
  rc:
    name: Only rc into main
    # The shared check reads the pull request and its labels.
    permissions:
      contents: read
      pull-requests: read
    uses: 51Degrees/common-ci/.github/workflows/only-rc-into-main.yml@main
    with:
      publishes-packages: true
