name: CI script tests

# Runs the Pester tests of the scripts in ci on Linux and Windows, where the
# builds run them, with common-ci checked out beside the repository for the
# release plan tests, which is where ci/packages.ps1 finds it.
# native-warnings.Tests.ps1 reads the native engine build files and the cxx
# sources they compile, so a change to those, or a move of the cxx
# submodule, runs the tests too. warnings-as-errors.Tests.ps1 reads the
# workflows and the root Directory.Build.targets, so a change to those runs
# them as well.

on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/**'
      - 'Directory.Build.targets'
      - 'device-detection/Hash.Engine.OnPremise/**'
      - 'ip-intelligence/Engine.OnPremise/**'
      - 'cxx'
  push:
    branches:
      - main
      - rc
    paths:
      - 'ci/**'
      - '.github/workflows/**'
      - 'Directory.Build.targets'
      - 'device-detection/Hash.Engine.OnPremise/**'
      - 'ip-intelligence/Engine.OnPremise/**'
      - 'cxx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-script-tests:
    name: Test the CI scripts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false

      # native-warnings.Tests.ps1 reads the cxx sources. Their data files
      # are not needed.
      - name: Check out the cxx submodule
        working-directory: repository
        run: git submodule update --init --depth 1 cxx

      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci
          persist-credentials: false

      - name: Run the tests
        shell: pwsh
        working-directory: repository
        run: |
          $tests = Get-ChildItem ./ci -Filter *.Tests.ps1
          Invoke-Pester -Path $tests.FullName -CI -Output Detailed
