name: CI script tests

# Runs the Pester tests of the scripts in ci on Linux and Windows, where the
# builds run them, with common-ci checked out for the release plan tests.

on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/ci-script-tests.yml'
  push:
    branches:
      - main
      - rc
    paths:
      - 'ci/**'
      - '.github/workflows/ci-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-script-tests:
    name: Test the CI scripts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci-checkout
          persist-credentials: false

      - name: Run the tests
        shell: pwsh
        env:
          COMMON_CI: ${{ github.workspace }}/common-ci-checkout
        run: |
          $tests = Get-ChildItem ./ci -Filter *.Tests.ps1
          Invoke-Pester -Path $tests.FullName -CI -Output Detailed
